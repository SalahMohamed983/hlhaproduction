<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هلها برودكشن — بيت إبداعي من مطروح</title>
    <meta name="description" content="هلها برودكشن بيت إبداعي من مطروح يحوّل الأفكار إلى أفلام وصور وتجارب رقمية لها أثر." />
    <link rel="icon" type="image/svg+xml" href="/Logo/Icon/Halha_icon dark.png" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('halha-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
